<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Bilel Jabrane" />
    <title>Bilel Jabrane · Full Stack Developer</title>
    <meta
      name="description"
      content="Bilel Jabrane is a full stack developer from Tunis, Tunisia, building with React, Node, TypeScript and PostgreSQL. Open to remote work."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph / social previews (home-page defaults; pages update these at runtime) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bilel Jabrane" />
    <meta property="og:title" content="Bilel Jabrane · Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer from Tunis, Tunisia, building with React, Node, TypeScript and PostgreSQL. Open to remote work."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bilel Jabrane, Full Stack Developer, Tunis, Tunisia. Open to remote work."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bilel Jabrane · Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer from Tunis, Tunisia, building with React, Node, TypeScript and PostgreSQL. Open to remote work."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
