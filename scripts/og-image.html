<!doctype html>
<!--
  Source for public/og-image.png (1200×630) and the PNG icons.
  To regenerate: open this file in Chrome, set the viewport to 1200×630 in DevTools,
  and use "Capture screenshot" (or run any headless screenshot tool against it).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 300 700;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2")
          format("woff2");
        font-weight: 500;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background-color: #f4f1ea;
        background-image:
          linear-gradient(rgb(27 36 48 / 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgb(27 36 48 / 0.06) 1px, transparent 1px);
        background-size: 30px 30px;
        color: #1b2430;
        font-family: "Space Grotesk", sans-serif;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .mark {
        position: relative;
        width: 64px;
        height: 64px;
        border: 4px solid #1b2430;
        color: #1b2430;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.05em;
      }
      .mark::after {
        content: "";
        position: absolute;
        top: -7px;
        right: -7px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #e4572e;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 2px solid #1b2430;
        background: #fbf9f4;
        padding: 10px 18px;
        font-size: 22px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e4572e;
      }
      h1 {
        font-size: 128px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .role {
        margin-top: 20px;
        font-size: 40px;
        color: #4a5462;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 2px solid #1b2430;
        padding-top: 24px;
        font-size: 24px;
      }
      .stack span {
        color: #b93f1b;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="mark mono">&lt;/&gt;</div>
      <div class="badge mono"><span class="dot"></span>Open to remote work</div>
    </div>
    <div>
      <h1>Bilel Jabrane</h1>
      <p class="role">Full Stack Developer · Tunis, Tunisia</p>
    </div>
    <div class="bottom mono">
      <p class="stack">
        React <span>·</span> Node.js <span>·</span> TypeScript <span>·</span> PostgreSQL
      </p>
      <p>UTC+1</p>
    </div>
  </body>
</html>
